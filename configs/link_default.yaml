# Link parameters matching Wang et al. (2021) Section 3
# BDP = 67.8 Mbps * 56 ms = 474,600 bytes (~325 segments at MSS=1460)
bandwidth_mbps: 67.8
base_rtt_ms: 56.0
loss_rate: 0.0001
segment_size: 1460
# Default queue: ~1x BDP in packets (474600 / 1460 ≈ 325)
queue_packets: 325
sim_time_s: 600.0
seed: 42
